<script>
  var menuOpen = false;
  function openNav() {
      const homeLink = document.querySelector(".topnav").children[0];
      const sideMenu = document.getElementById("sidemenu");
      if (!menuOpen) {
        window.scrollTo(0, 0);
        sideMenu.style.display = "flex";
        sideMenu.style.width = "calc(150px + 0px)";
        sideMenu.style.height = "calc(150px + 0px)";
        setTimeout(() => {
            sideMenu.style.top = "0px";
            homeLink.href = "index.html";
            }, 40);
        setTimeout(() => {
        // one person created websites are sometimes lazy
        sideMenu.style.width = null;
        sideMenu.style.height = null;
        sideMenu.classList.add("open");
        menuOpen = true
        }, 130);
        window.scrollTo(0, 0);
        document.body.style.overflow = "hidden";
        // if any scroll is attempted,
        // set this to the previous value
        window.onscroll = function() {
            window.scrollTo(0, 0);
        }
    }
}

function closeNav() {
    const homeLink = document.querySelector(".topnav").children[0];
    const sideMenu = document.getElementById("sidemenu")
    if (menuOpen) {
        document.body.style.overflow = null;
        sideMenu.classList.remove("open");
        sideMenu.style.width = "calc(150px + 0px)";
        sideMenu.style.height = "calc(150px + 0px)";
        sideMenu.style.top = "-150px";
        homeLink.href = "#";
        sideMenu.style.transition = "width 0.2s cubic-bezier(0, 0, 0, 1), height 0.2s cubic-bezier(0, 0, 0, 1), top 0.15s linear";
        setTimeout(() => {
            sideMenu.style.display = "none";
            sideMenu.style.transition = null;
            menuOpen = false
            }, 400);
        window.onscroll = function() {};
    }
}
